<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#17301c',
                        secondary: '#e6e8d1',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #e6e8d1; }
        .photo-item img { transition: transform 0.2s; }
        .photo-item:hover img { transform: scale(1.05); }
        .photo-item.selected img { border-color: #17301c; border-width: 4px; }
        .loading-overlay { display: none; }
        .loading-overlay.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-900 min-h-screen">
    <div id="loading-overlay" class="loading-overlay fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center">
        <div class="bg-white p-6 rounded-xl shadow-2xl flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
            <p class="text-gray-700 font-medium" id="loading-text">Đang xử lý...</p>
        </div>
    </div>

    <nav class="bg-primary shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <img src="{{ request.url_for('static', path='logo.png') }}" alt="Logo" class="h-10 w-auto rounded-md shadow-md">
            <h1 class="text-xl font-extrabold tracking-tight text-white">Photobooth <span class="text-secondary">HCX</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-xs font-semibold text-gray-300 flex items-center gap-2 bg-black/20 px-3 py-1.5 rounded-full">
                <span id="sync-indicator" class="h-2 w-2 rounded-full bg-green-500"></span>
                ONLINE
            </div>
            <button onclick="toggleSettings()" class="p-2 hover:bg-black/20 rounded-full transition-colors text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-7 space-y-6">
            <section class="bg-white rounded-3xl shadow-sm border border-gray-200 p-8">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Thư viện ảnh</h2>
                        <p class="text-sm text-gray-400">Chọn 4 tấm ảnh để tạo bản in</p>
                    </div>
                    <button onclick="forceRefresh()" class="p-2 text-primary hover:bg-secondary/50 rounded-xl transition-all flex items-center gap-2 text-sm font-bold">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        Làm mới
                    </button>
                </div>
                
                <div id="photo-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-4 gap-4 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
                    </div>
            </section>

            <div class="flex flex-wrap gap-4">
                <button onclick="generatePreview()" class="flex-1 bg-white hover:bg-gray-50 text-gray-700 font-bold py-5 px-6 rounded-3xl border-2 border-gray-100 transition-all flex items-center justify-center gap-3 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    Xem thử (Preview)
                </button>
                <button onclick="printSelection()" class="flex-[2] bg-primary hover:opacity-90 text-white font-bold py-5 px-6 rounded-3xl shadow-xl shadow-primary/20 transition-all flex items-center justify-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    Xác nhận và In ngay
                </button>
            </div>

            <section class="bg-white rounded-3xl shadow-sm border border-gray-200 p-8 space-y-6">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
                        </svg>
                        Khung hình & Bố cục hệ thống
                    </h3>
                </div>

                <div class="mt-8 pt-6 border-t border-gray-100">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-bold text-[13px] text-gray-500 uppercase tracking-widest">Điều chỉnh vị trí & Kích thước ảnh</h4>
                        <button onclick="saveLayoutSettings()" class="bg-primary/10 text-primary hover:bg-primary hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition-all">Lưu & Áp dụng</button>
                    </div>
                    <div id="sliders-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
                        </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest block mb-2">Layout</label>
                        <select id="layout-type" onchange="loadLayout()" class="w-full bg-secondary/30 border-2 border-transparent focus:border-primary focus:bg-white rounded-2xl px-5 py-3 focus:outline-none transition-all font-bold text-gray-700">
                            <option value="PORTRAIT_STRIP" {% if active_type == 'PORTRAIT_STRIP' %}selected{% endif %}>Dải ảnh dọc (2x4)</option>
                            <option value="LANDSCAPE_4" {% if active_type == 'LANDSCAPE_4' %}selected{% endif %}>Ảnh ngang 4 tấm</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest block mb-2">Frame</label>
                        <select id="frame-select" onchange="updateFrame()" class="w-full bg-secondary/30 border-2 border-transparent focus:border-primary focus:bg-white rounded-2xl px-5 py-3 focus:outline-none transition-all font-bold text-gray-700">
                            <option>Đang tải frames...</option>
                        </select>
                    </div>
                </div>
            </section>
        </div>

        <div class="lg:col-span-5 space-y-6">
            <section class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden sticky top-24">
                <div class="p-5 bg-gray-50 border-b border-gray-100 flex justify-between items-center">
                    <h3 class="font-bold text-sm text-gray-500 uppercase tracking-widest">Preview</h3>
                    <div class="flex items-center gap-2">
                        <span id="auto-preview-timer" class="text-[10px] font-bold text-gray-400"></span>
                        <span id="preview-status" class="text-[10px] bg-primary text-secondary px-3 py-1 rounded-full font-extrabold">READY</span>
                    </div>
                </div>
                <div class="aspect-[2/3] bg-primary/10 flex items-center justify-center p-4">
                    <img id="preview-img" src="" class="max-h-full max-w-full shadow-2xl rounded-sm border-4 border-white" alt="Preview Placeholder">
                </div>
                <div class="p-6 bg-secondary/20 space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-primary uppercase">Máy in hiện tại:</span>
                        <span id="current-printer-name" class="text-xs font-black text-gray-700">Đang tải...</span>
                    </div>
                    <div class="h-1 w-full bg-gray-200 rounded-full overflow-hidden">
                        <div id="preview-progress" class="h-full bg-primary transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="settings-panel" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex justify-end transition-opacity duration-300 opacity-0 pointer-events-none backdrop-blur-sm">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300">
            <div class="p-8 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-2xl font-black">Máy in & Hệ thống</h2>
                <button onclick="toggleSettings()" class="p-2 hover:bg-gray-100 rounded-full transition-all">
                    <svg xmlns="http://www.w3.org/2000/xl" class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-8 space-y-10 custom-scrollbar">
                <section>
                    <div class="flex items-center gap-3 mb-6">
                        <div class="p-2 bg-gray-100 rounded-lg"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg></div>
                        <h3 class="font-bold text-lg">Máy in hệ thống</h3>
                    </div>
                    <div class="space-y-4">
                        <select id="printer-select" class="w-full bg-secondary/30 border-2 border-transparent focus:border-primary focus:bg-white rounded-2xl px-5 py-4 focus:outline-none transition-all font-bold text-gray-700">
                            <option>Đang quét...</option>
                        </select>
                        <div class="flex gap-2">
                            <button onclick="applyPrinter()" class="flex-[2] bg-primary text-white font-bold py-4 rounded-2xl hover:opacity-90 shadow-lg shadow-primary/10 transition-all">
                                Áp dụng
                            </button>
                            <button onclick="testPrint()" class="flex-1 bg-white border-2 border-gray-100 text-gray-600 font-bold py-4 rounded-2xl hover:bg-gray-50 transition-all">
                                Test
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        let allSettings = {{ settings | tojson }};
        let activePrinter = "{{ engine.printer_name }}";
        let selectedPhotos = [];
        let lastPhotoListJson = "";
        let autoPreviewTimeout = null;
        let countdownInterval = null;

        // UI Helpers
        function showLoading(text) {
            document.getElementById('loading-text').innerText = text || 'Đang xử lý...';
            document.getElementById('loading-overlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.remove('active');
        }

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            const content = panel.querySelector('div');
            const isOpen = !panel.classList.contains('pointer-events-none');
            
            if (isOpen) {
                panel.classList.add('pointer-events-none');
                panel.classList.replace('opacity-100', 'opacity-0');
                content.classList.replace('translate-x-0', 'translate-x-full');
            } else {
                panel.classList.remove('pointer-events-none');
                panel.classList.replace('opacity-0', 'opacity-100');
                content.classList.replace('translate-x-full', 'translate-x-0');
                loadAvailablePrinters();
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-8 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-2xl shadow-2xl z-[100] transition-all duration-300 translate-y-20 opacity-0 font-bold text-white ${type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-500' : 'bg-primary'}`;
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('translate-y-20', 'translate-y-0');
                toast.classList.replace('opacity-0', 'opacity-100');
            }, 10);
            setTimeout(() => {
                toast.classList.replace('translate-y-0', 'translate-y-20');
                toast.classList.replace('opacity-100', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function loadAvailablePrinters() {
            try {
                const response = await fetch('/api/available_printers');
                const printers = await response.json();
                const select = document.getElementById('printer-select');
                select.innerHTML = '';
                printers.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p; opt.text = p;
                    if (p === activePrinter) opt.selected = true;
                    select.appendChild(opt);
                });
            } catch (e) { console.error(e); }
        }

        async function loadFrames() {
            try {
                const response = await fetch('/api/list_frames');
                const frames = await response.json();
                const select = document.getElementById('frame-select');
                const currentLayout = document.getElementById('layout-type').value;
                const currentFramePath = allSettings[currentLayout].frame_path.replace('Frames/', '');
                
                select.innerHTML = '';
                frames.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f; opt.text = f;
                    if (f === currentFramePath) opt.selected = true;
                    select.appendChild(opt);
                });
            } catch (e) { console.error(e); }
        }

        async function updateFrame() {
            const layout = document.getElementById('layout-type').value;
            const frame = document.getElementById('frame-select').value;
            const response = await fetch('/api/update_frame_path', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: layout, frame: frame })
            });
            const result = await response.json();
            if (result.status === 'success') {
                allSettings[layout].frame_path = `Frames/${frame}`;
                triggerAutoPreview();
                showToast('Đã cập nhật Frame!', 'success');
            }
        }

        async function applyPrinter() {
            const name = document.getElementById('printer-select').value;
            showLoading('Đang kết nối máy in...');
            try {
                const response = await fetch(`/api/set_printer?printer_name=${encodeURIComponent(name)}`, { method: 'POST' });
                const result = await response.json();
                if (result.status === 'success') {
                    activePrinter = name;
                    document.getElementById('current-printer-name').innerText = name;
                    showToast('Máy in đã sẵn sàng!', 'success');
                } else { showToast('Lỗi: ' + result.message, 'error'); }
            } catch (e) { showToast('Lỗi kết nối server', 'error'); }
            hideLoading();
        }

        async function testPrint() {
            const name = document.getElementById('printer-select').value;
            showLoading('Đang thực hiện lệnh in thử...');
            try {
                const response = await fetch(`/api/test_print?printer_name=${encodeURIComponent(name)}`, { method: 'POST' });
                const result = await response.json();
                if (result.status === 'success') { showToast('Lệnh in thử đã được gửi!', 'success'); } 
                else { showToast('Lỗi in thử: ' + result.message, 'error'); }
            } catch (e) { showToast('Lỗi kết nối server', 'error'); }
            hideLoading();
        }

        async function forceRefresh() {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '<div class="col-span-full py-20 text-center text-primary font-bold animate-pulse uppercase">ĐANG QUÉT DỮ LIỆU...</div>';
            selectedPhotos = [];
            lastPhotoListJson = ""; 
            setTimeout(() => loadPhotos(false, true), 500);
        }

        async function loadPhotos(isPolling = false, forceCacheBust = false) {
            try {
                const url = forceCacheBust ? `/api/photos?t=${Date.now()}` : '/api/photos';
                const response = await fetch(url);
                const photos = await response.json();
                const currentJson = JSON.stringify(photos);

                if (isPolling && currentJson === lastPhotoListJson) return;
                lastPhotoListJson = currentJson;
                
                selectedPhotos = selectedPhotos.filter(p => photos.includes(p));
                renderGallery(photos);
                
                if (!isPolling && selectedPhotos.length === 0 && photos.length >= 4) {
                    selectedPhotos = photos.slice(0, 4);
                    renderGallery(photos);
                    generatePreview();
                }
            } catch (error) { console.error("Failed to load photos:", error); }
        }

        function renderGallery(photos) {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';
            if (photos.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-gray-300 font-medium">Chưa có ảnh.</div>';
                return;
            }
            photos.forEach(photo => {
                const isSelected = selectedPhotos.includes(photo);
                const badgeIndex = selectedPhotos.indexOf(photo) + 1;
                const item = document.createElement('div');
                item.className = `photo-item relative aspect-square rounded-2xl overflow-hidden bg-gray-100 cursor-pointer border-4 transition-all ${isSelected ? 'border-primary shadow-lg shadow-primary/20' : 'border-transparent'}`;
                item.innerHTML = `
                    <img src="/photos/${photo}" class="w-full h-full object-cover" alt="${photo}">
                    <div class="absolute inset-0 bg-primary/20 flex items-center justify-center transition-opacity ${isSelected ? 'opacity-100' : 'opacity-0'}">
                        <div class="bg-primary text-secondary w-10 h-10 rounded-full flex items-center justify-center font-black shadow-2xl border-4 border-white transform scale-110">${badgeIndex}</div>
                    </div>
                `;
                item.onclick = () => togglePhoto(photo);
                grid.appendChild(item);
            });
        }

        function togglePhoto(photo) {
            const index = selectedPhotos.indexOf(photo);
            if (index > -1) { selectedPhotos.splice(index, 1); } 
            else {
                if (selectedPhotos.length >= 4) { showToast('Giới hạn 4 ảnh!', 'error'); return; }
                selectedPhotos.push(photo);
            }
            renderGallery(JSON.parse(lastPhotoListJson));
            triggerAutoPreview();
        }

        function triggerAutoPreview() {
            if (selectedPhotos.length < 4) return;
            if (autoPreviewTimeout) clearTimeout(autoPreviewTimeout);
            if (countdownInterval) clearInterval(countdownInterval);
            
            let timeLeft = 1;
            const timerEl = document.getElementById('auto-preview-timer');
            const progressEl = document.getElementById('preview-progress');
            
            timerEl.innerText = `Auto Preview in ${timeLeft}s...`;
            progressEl.style.width = '0%';
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerEl.innerText = `Auto Preview in ${timeLeft}s...`;
                    progressEl.style.width = `${((3 - timeLeft) / 3) * 100}%`;
                } else {
                    timerEl.innerText = '';
                    progressEl.style.width = '100%';
                    clearInterval(countdownInterval);
                }
            }, 1000);

            autoPreviewTimeout = setTimeout(() => { generatePreview(); }, 3000);
        }

        async function generatePreview() {
            if (selectedPhotos.length < 4) return;
            document.getElementById('preview-status').innerText = 'PROCESSING';
            const response = await fetch('/api/preview', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: document.getElementById('layout-type').value, photos: selectedPhotos })
            });
            const result = await response.json();
            if (result.status === 'success') {
                document.getElementById('preview-img').src = result.preview_url;
                document.getElementById('preview-status').innerText = 'VIEWING';
                document.getElementById('preview-progress').style.width = '0%';
            } else { showToast('Lỗi preview!', 'error'); }
        }

        async function loadLayout() {
            const type = document.getElementById('layout-type').value;
            await fetch(`/api/set_active_type?type=${type}`, { method: 'POST' });
            loadFrames();
            renderLayoutEditor();
            triggerAutoPreview();
        }

        async function printSelection() {
            if (selectedPhotos.length < 4) { showToast('Vui lòng chọn 4 ảnh!', 'error'); return; }
            if(!confirm("Xác nhận in 4 ảnh này?")) return;
            showLoading('Đang chuẩn bị bản in...');
            document.getElementById('preview-status').innerText = 'PRINTING';
            const response = await fetch('/api/print', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: document.getElementById('layout-type').value, photos: selectedPhotos })
            });
            const result = await response.json();
            hideLoading();
            if (result.status === 'success') {
                showToast('Đã gửi lệnh in!', 'success');
                document.getElementById('preview-status').innerText = 'PRINTED';
            } else {
                showToast('Lỗi: ' + result.message, 'error');
                document.getElementById('preview-status').innerText = 'ERROR';
            }
        }

        // Init
        document.getElementById('current-printer-name').innerText = activePrinter || 'Trống';
        loadLayout();
        loadPhotos();
        setInterval(() => loadPhotos(true), 3000);

function renderLayoutEditor() {
            const layout = document.getElementById('layout-type').value;
            const slots = allSettings[layout].slots;
            const container = document.getElementById('sliders-container');
            const maxWidth = allSettings[layout].canvas_size[0];
            const maxHeight = allSettings[layout].canvas_size[1];
            
            container.innerHTML = '';
            const ratio = 3 / 2;
            
            slots.forEach((slot, i) => {
                slot.h = Math.round(slot.w / ratio);

                // THÊM onchange="saveLayoutSettings(true)" để chỉ lưu/load ảnh khi buông chuột
                const slotHtml = `
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <div class="font-bold text-sm text-primary mb-3 flex justify-between items-center">
                        <span>Thông số Ảnh ${i + 1}</span>
                        <span class="text-[10px] bg-primary text-secondary px-2 py-1 rounded-md font-bold">Khóa khổ 3x2</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-xs font-semibold text-gray-600">
                        <div>
                            <label class="flex justify-between items-center mb-1">
                                <span>X (Ngang):</span>
                                <input type="number" id="num-${layout}-x-${i}" value="${slot.x}" min="0" max="${maxWidth}" oninput="updateSlot('${layout}', ${i}, 'x', this.value)" onchange="saveLayoutSettings(true)" class="w-16 bg-white border border-gray-200 rounded-md text-right text-primary font-bold px-1 py-0.5 focus:outline-none focus:border-primary">
                            </label>
                            <input id="input-${layout}-x-${i}" type="range" min="0" max="${maxWidth}" value="${slot.x}" oninput="updateSlot('${layout}', ${i}, 'x', this.value)" onchange="saveLayoutSettings(true)" class="w-full accent-primary">
                        </div>
                        
                        <div>
                            <label class="flex justify-between items-center mb-1">
                                <span>Y (Dọc):</span>
                                <input type="number" id="num-${layout}-y-${i}" value="${slot.y}" min="0" max="${maxHeight}" oninput="updateSlot('${layout}', ${i}, 'y', this.value)" onchange="saveLayoutSettings(true)" class="w-16 bg-white border border-gray-200 rounded-md text-right text-primary font-bold px-1 py-0.5 focus:outline-none focus:border-primary">
                            </label>
                            <input id="input-${layout}-y-${i}" type="range" min="0" max="${maxHeight}" value="${slot.y}" oninput="updateSlot('${layout}', ${i}, 'y', this.value)" onchange="saveLayoutSettings(true)" class="w-full accent-primary">
                        </div>
                        
                        <div>
                            <label class="flex justify-between items-center mb-1">
                                <span>Width (Rộng):</span>
                                <input type="number" id="num-${layout}-w-${i}" value="${slot.w}" min="10" max="${maxWidth}" oninput="updateSlot('${layout}', ${i}, 'w', this.value)" onchange="saveLayoutSettings(true)" class="w-16 bg-white border border-gray-200 rounded-md text-right text-primary font-bold px-1 py-0.5 focus:outline-none focus:border-primary">
                            </label>
                            <input id="input-${layout}-w-${i}" type="range" min="10" max="${maxWidth}" value="${slot.w}" oninput="updateSlot('${layout}', ${i}, 'w', this.value)" onchange="saveLayoutSettings(true)" class="w-full accent-primary">
                        </div>
                        
                        <div>
                            <label class="flex justify-between items-center mb-1">
                                <span>Height (Cao):</span>
                                <input type="number" id="num-${layout}-h-${i}" value="${slot.h}" min="10" max="${maxHeight}" oninput="updateSlot('${layout}', ${i}, 'h', this.value)" onchange="saveLayoutSettings(true)" class="w-16 bg-white border border-gray-200 rounded-md text-right text-primary font-bold px-1 py-0.5 focus:outline-none focus:border-primary">
                            </label>
                            <input id="input-${layout}-h-${i}" type="range" min="10" max="${maxHeight}" value="${slot.h}" oninput="updateSlot('${layout}', ${i}, 'h', this.value)" onchange="saveLayoutSettings(true)" class="w-full accent-primary">
                        </div>
                    </div>
                </div>`;
                container.innerHTML += slotHtml;
            });
        }

        // Đã xóa biến previewDebounce không còn cần thiết
        function updateSlot(layout, index, prop, value) {
            let val = parseInt(value);
            if (isNaN(val)) return; 
            
            let slot = allSettings[layout].slots[index];
            const ratio = 3 / 2;
            
            if (prop === 'w' || prop === 'h') {
                if (prop === 'w') {
                    slot.w = val;
                    slot.h = Math.round(val / ratio);
                } else if (prop === 'h') {
                    slot.h = val;
                    slot.w = Math.round(val * ratio);
                }
                
                document.getElementById(`input-${layout}-w-${index}`).value = slot.w;
                document.getElementById(`num-${layout}-w-${index}`).value = slot.w;
                document.getElementById(`input-${layout}-h-${index}`).value = slot.h;
                document.getElementById(`num-${layout}-h-${index}`).value = slot.h;
            } else {
                slot[prop] = val;
                document.getElementById(`input-${layout}-${prop}-${index}`).value = val;
                document.getElementById(`num-${layout}-${prop}-${index}`).value = val;
            }
            
            if (layout === 'PORTRAIT_STRIP') {
                let targetIndex = -1;
                let isLeftColumn = false;

                if (index < 4) {
                    targetIndex = index + 4;
                    isLeftColumn = true;
                } else if (index >= 4 && index < 8) {
                    targetIndex = index - 4;
                    isLeftColumn = false;
                }

                if (targetIndex !== -1) {
                    let targetSlot = allSettings[layout].slots[targetIndex];

                    if (prop === 'w' || prop === 'h' || prop === 'y') {
                        targetSlot.w = slot.w;
                        targetSlot.h = slot.h;
                        targetSlot.y = slot.y;

                        document.getElementById(`input-${layout}-w-${targetIndex}`).value = targetSlot.w;
                        document.getElementById(`num-${layout}-w-${targetIndex}`).value = targetSlot.w;
                        document.getElementById(`input-${layout}-h-${targetIndex}`).value = targetSlot.h;
                        document.getElementById(`num-${layout}-h-${targetIndex}`).value = targetSlot.h;
                        document.getElementById(`input-${layout}-y-${targetIndex}`).value = targetSlot.y;
                        document.getElementById(`num-${layout}-y-${targetIndex}`).value = targetSlot.y;
                    }

                    if (prop === 'x') {
                        const columnGap = 600; 
                        if (isLeftColumn) {
                            targetSlot.x = slot.x + columnGap;
                        } else {
                            targetSlot.x = slot.x - columnGap;
                        }

                        document.getElementById(`input-${layout}-x-${targetIndex}`).value = targetSlot.x;
                        document.getElementById(`num-${layout}-x-${targetIndex}`).value = targetSlot.x;
                    }
                }
            }
            

        }
        async function saveLayoutSettings(silent = false) {
            if (!silent) showLoading('Đang lưu cấu hình...');
            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(allSettings)
                });
                if (response.ok) {
                    if (!silent) {
                        showToast('Đã lưu cấu hình khung hình!', 'success');
                        hideLoading();
                    }
                    if (selectedPhotos.length >= 4) generatePreview();
                }
            } catch (e) {
                if (!silent) {
                    hideLoading();
                    showToast('Lỗi khi lưu cấu hình', 'error');
                }
            }
        }
    </script>
</body>
</html>
